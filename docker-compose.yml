services:
  alvo:
    build: .
    command: ["python", "target_server.py"]
    expose:
      - "8000"
    networks:
      - vigianet
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 3

  monitor:
    build: .
    command: ["python", "monitor_service.py"]
    environment:
      TARGET_URL: "http://alvo:8000/health"
      CHECK_INTERVAL_SECONDS: "5"
      REQUEST_TIMEOUT_SECONDS: "2"
      LOG_PATH: "/data/monitor.jsonl"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - monitor-data:/data
    depends_on:
      alvo:
        condition: service_healthy
    networks:
      - vigianet
    restart: unless-stopped

networks:
  vigianet:
    name: vigianet-demo
    driver: bridge

volumes:
  monitor-data:
